name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publication_mode:
        description: Site variant to deploy
        required: true
        default: preview
        type: choice
        options:
          - preview
          - release

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_mode || 'preview' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install web UI dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Sync pdfcn components
        working-directory: web
        run: npm run pdfcn:sync

      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate example claim gate core
        run: python scripts/claim_gate.py toolkit/claim.example.json --json

      - name: Validate reusable claim gate Action end to end
        uses: ./
        with:
          claim: toolkit/claim.example.json

      - name: Test native MCP package
        working-directory: packages/mcp
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Type-check React UI and PDF templates
        working-directory: web
        run: npm run typecheck

      - name: Build selected publication
        env:
          PUBLICATION_REPO_URL: https://github.com/${{ github.repository }}
          PUBLICATION_UMBRELLA_URL: https://github.com/milleleaf
          PUBLICATION_SOURCE_REF: ${{ github.sha }}
        run: python scripts/build_with_ui.py

      - name: Validate repository evidence structure and publication traceability
        run: python scripts/check_publication.py

      - name: Validate generated artifact interaction and links
        run: python scripts/check_site_links.py

      - name: Enforce release approval policy
        if: ${{ env.PUBLICATION_MODE == 'release' }}
        run: python scripts/check_release.py

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
