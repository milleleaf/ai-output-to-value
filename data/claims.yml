  - id: dora-ai-amplifier-2025
    claim_text: DORA's 2025 research characterises AI primarily as an amplifier of an organisation's existing strengths and weaknesses and links returns to the underlying organisational system rather than tools alone.
    status: supported
    launch_critical: true
    evidence:
      - source_id: dora-2025
        source_version: 2025 report landing page reviewed 2026-09-14
        locator: DORA Research 2025 overview, introductory summary beneath the report heading.
        relevant_finding: The overview describes AI's primary role as an amplifier and links returns to strategic focus on the underlying organisational system.
        qualification: DORA is industry research run by Google Cloud. This framing is not a universal staffing rule or guaranteed ROI for a particular company.
    published_in:
      - file: content/ai-does-not-eliminate-technical-capability.md
        locator: "## AI can make code cheaper without making engineering unnecessary"
    reviewer: AI-assisted initial source check
    reviewed: 2026-09-14
    independent_review_status: pending

  - id: nber-generative-ai-customer-support-2023
    claim_text: In a study of 5,179 customer-support agents, access to a generative-AI assistant increased issues resolved per hour by 14% on average, with larger effects for novice and lower-skilled workers and minimal effects for experienced and highly skilled workers.
    status: supported
    launch_critical: true
    evidence:
      - source_id: brynjolfsson-li-raymond-generative-ai-at-work
        source_version: NBER Working Paper 31161, revision dated November 2023
        locator: Abstract.
        relevant_finding: The abstract reports a 14% average increase in issues resolved per hour and heterogeneous effects across workers.
        qualification: This is a specific customer-support intervention, not a universal productivity multiplier for software development, consulting, management, or knowledge work generally.
    published_in:
      - file: content/ai-business-capability-and-judgement.md
        locator: "## 2. AI can participate in persuasion and customer interaction"
      - file: content/executive-guide.md
        locator: "## 5. AI can do business work too"
      - file: docs/public-case-corpus.md
        locator: "## What the first rows cover"
    reviewer: AI-assisted initial source check
    reviewed: 2026-09-14
    independent_review_status: pending

  - id: uk-ai-playbook-human-control-lifecycle-2025
    claim_text: The UK Government AI Playbook calls for meaningful human control at appropriate stages, lifecycle management, appropriate skills and expertise, testing, monitoring, and clear accountability.
    status: supported
    launch_critical: true
    evidence:
      - source_id: uk-government-ai-playbook
        source_version: HTML playbook reviewed 2026-09-14
        locator: Principles 4, 5 and 9; sections "Accountability and responsibility" and "Governance".
        relevant_finding: The playbook describes meaningful human control, lifecycle support and maintenance, testing and monitoring, skills and expertise, and explicit responsibilities across the AI lifecycle.
        qualification: UK public-sector guidance; useful for governance but not empirical proof that the same controls create financial value in every private-sector use case.
    published_in:
      - file: docs/framework-crosswalk.md
        locator: "## UK Government AI Playbook"
    reviewer: AI-assisted initial source check
    reviewed: 2026-09-14
    independent_review_status: pending

  - id: cloudflare-wallets-availability-2026-09
    claim_text: Cloudflare has announced an Account Wallet and Virtual Wallet architecture, but at the review date only wallet-handle reservation is available; a reserved handle does not yet send, receive, or hold funds.
    status: supported
    launch_critical: false
    availability_status: announced_full_wallet_forthcoming
    evidence:
      - source_id: cloudflare-wallets-docs
        source_version: last updated 2026-08-19; reviewed 2026-09-14
        locator: Sections "What is available today" and introductory Account Wallet / Virtual Wallet description.
        relevant_finding: The documentation says handle reservations are available today, reserved handles do not yet allow sending, receiving, or holding funds, and describes Account Wallet / Virtual Wallet capabilities in future tense.
        qualification: Keep this separate from the currently documented Agentic Payments protocols. Do not describe Cloudflare Wallet delegated spending as currently deployed unless the availability page changes.
      - source_id: cloudflare-agent-identity-wallet-press-release
        source_version: press release 2026-08-04
        locator: Paragraph stating handle reservation opens today and full wallet access / Virtual Wallet issuance will be available in coming months.
        relevant_finding: The announcement explicitly distinguishes immediate handle reservation from forthcoming full wallet access.
        qualification: Product announcement contains forward-looking statements.
    published_in:
      - file: content/company-actors-vs-instruments.md
        locator: "## Cloudflare's announced architecture helps show the difference"
      - file: content/non-human-actors-and-accountability.md
        locator: "## Agent identity is not legal identity"
      - file: content/assess-every-layer-of-the-company.md
        locator: "## Organisational AI can make more authority programmable"
    reviewer: AI-assisted initial source check
    reviewed: 2026-09-14
    independent_review_status: pending

