  - id: linux-kernel-open-source
    claim_text: The Linux kernel is available under an open-source licence; zero acquisition price does not by itself establish zero capability or economic value.
    status: qualified
    launch_critical: false
    evidence:
      - source_id: linux-kernel-free-software-faq
        source_version: kernel.org FAQ reviewed 2026-09-14
        locator: Question "Is Linux Kernel Free Software?"
        relevant_finding: The official kernel FAQ identifies the Linux kernel as Free Software released under GNU GPL version 2.
        qualification: The source establishes licensing status only. The statement about capability or economic value is an editorial inference supported separately by open-source economic evidence.
    published_in:
      - file: content/ai-does-not-eliminate-technical-capability.md
        locator: "## Linux is free"
    reviewer: AI-assisted initial source check
    reviewed: 2026-09-14
    independent_review_status: pending

  - id: oss-zero-price-not-zero-economic-value
    claim_text: Research on widely used open-source software provides evidence that zero licence price does not imply zero economic value or zero replacement cost.
    status: qualified
    launch_critical: false
    evidence:
      - source_id: hbs-value-open-source-software-2024
        source_version: HBS AI Institute summary reviewed 2026-09-14
        locator: Discussion of supply-side and demand-side estimates in "Revealing Value — The Economic Power of Open Source Software".
        relevant_finding: The study reports model-based development/replacement-value estimates far above the acquisition price of the shared software.
        qualification: Editorial inference from model-based estimates; not a market capitalisation, a Linux valuation, or proof that every open-source project has high economic value.
    published_in:
      - file: content/source-code-open-source-and-ai.md
        locator: "## Open source demonstrates why price is not value"
      - file: content/ai-does-not-eliminate-technical-capability.md
        locator: "## Linux is free"
    reviewer: AI-assisted initial source check
    reviewed: 2026-09-14
    independent_review_status: pending
