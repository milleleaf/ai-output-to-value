claims:
  - id: replit-plan-positioning-2026-09
    claim_text: Replit positions Starter as a plan for exploring what is possible and Pro as a plan for commercial and professional builds.
    status: supported
    launch_critical: true
    evidence:
      - source_id: replit-home-plan-positioning
        source_version: reviewed 2026-09-14
        locator: Homepage pricing section "Start Small. Scale Fast. Designed for Every Stage", Starter and Replit Pro plan cards.
        relevant_finding: Starter says "For exploring what’s possible" and Replit Pro says "For commercial and professional builds".
        qualification: This is vendor product positioning, not evidence that a free-plan result is unsuitable for clients or that a paid plan certifies professional quality.
    published_in:
      - file: content/tool-access-vs-client-readiness.md
        locator: "## A concrete example: Replit"
      - file: content/executive-guide.md
        locator: "### Replit is a useful concrete example"
